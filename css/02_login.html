<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="02_login.css">
    <title>Login</title>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form action="">
            <div>
                <label for="email">Email : </label>
                <input type="email" name="email" id="email" placeholder="enter your email" class="inputBox">
            </div>
            <div>
                <label for="password">Password : </label>
                <input type="password" name="password" id="password" minlength="8" class="inputBox">
            </div>
            <input type="submit" value="Enter">
        </form>
    </div>
</body>
</html>
